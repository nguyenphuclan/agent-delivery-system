# phase-contracts.yaml — formal contracts for every do-ticket phase
#
# Replaces the static prerequisite table in do-ticket/SKILL.md.
# do-ticket uses this to:
#   1. Validate inputs before invoking a child skill
#   2. Verify outputs after the skill returns
#   3. Detect stale state (output exists but inputs changed since)
#   4. Compute "earliest missing phase" when user requests a jump
#
# Path conventions:
#   {ticket_dir}   = {output}/tickets/<TICKET_ID>/
#   {project_docs} = public-project-docs/<active-project>/
#   Plain filename = relative to {ticket_dir}
#   "ctx.<key>" = field in ticket-context.yaml
#   "state.<key>" = field in ticket-state.yaml
#
# Stale-check convention (phases with scan-init artifacts):
#   Before invoking, read {project_docs}/_index.yaml → phase_readiness[N].ready
#   If false → G10 block; surface missing[] list; options: rescan / skip / abort
#   Stale-check note on each phase lists the readiness gate ID.

contracts:

  branch:                               # Phase 1
    skill: do-ticket internal
    inputs:
      required:
        - "projects.md (active project + repos + base_branch)"
      optional: []
    outputs:
      - "ticket-state.yaml (created)"
      - "ticket-context.yaml (created with resolved.* + fingerprints)"
    state_writes:
      phase: branch
      branch: <TICKET_ID>
      base_branch: <from projects.md>

  classify:                             # Phase 2
    skill: do-ticket internal
    inputs:
      required:
        - "ticket-context.yaml (resolved.*)"
      optional:
        - "Jira ticket metadata (issue_type, labels, components)"
    outputs:
      - "ticket-context.yaml (+ ticket_type, risk_profile, risk_factors)"
    state_writes:
      phase: classify
    user_gate:
      "Confirm or override auto-classified ticket_type"

  rebase-check:                         # Phase 4
    skill: do-ticket internal
    inputs:
      required:
        - "git working tree"
        - "state.base_branch"
    outputs:
      - "(no file output; may rebase or block on conflict)"
    state_writes:
      phase: rebase-check  # or 'blocked' on conflict
    failure_modes: [FM-REBASE-CONFLICT, FM-LARGE-DIVERGENCE, FM-SHARED-VERSION-COLLISION]

  requirements:                         # Phase 5
    skill: jira-to-requirements
    inputs:
      required:
        - "ticket-context.yaml"
        - "ctx.jira_prefix (project field)"
        - "Jira API access"
      optional:
        - "requirements.md (existing — for update mode)"
    outputs:
      - "requirements.md"
      - "ticket-context.yaml (+ jira.fetched_at, jira.comment_count, fingerprints.requirements_sha)"
    state_writes:
      phase: requirements
    update_cycle: "On update_count > 0, write requirements-vN-diff.md and confirm with user"

  enrich:                               # Phase 5.5 — PO-proxy enrichment
    skill: enrich-requirements
    inputs:
      required:
        - "requirements.md"
        - "ticket-context.yaml"
      optional:
        - "{project_docs}/_quickref.yaml"
        - "{project_docs}/domain/<Entity>.yaml (per entity in requirements)"
        - "{project_docs}/domain/_glossary.yaml"
        - "{project_docs}/flows/flow_index.yaml + matching flow .md (per flow keyword)"
        - "{project_docs}/concepts/*.md (per overloaded term)"
        - "{project_docs}/lifecycle/*.md (when state transitions are in scope)"
        - "{project_docs}/incidents/incidents.yaml (tier-1 only — for edge-case hints)"
        - "{project_docs}/conventions.md"
    outputs:
      - "requirements-enriched.md"
      - "ticket-context.yaml (+ fingerprints.requirements_enriched_sha, enrichment_verdict, enrichment_open_questions_count, po_escalation[])"
    state_writes:
      phase: enrich                     # OR phase: blocked if user defers or wants to escalate questions
    blocks_on:
      - "user has not reviewed enriched spec (always — first run)"
      - "Sibling Coverage Table has unresolved rows"
      - "Open Questions with blocking: true"
    skip_when:
      - "ticket_type ∈ {bugfix-small, hotfix, doc-only, refactor, spike, migration-only, bugfix-investigated}"
      - "requirements.md missing (Phase 5 must run first)"
      - "ticket-context.dps_session_id is set (DPS handoff supplies richer spec)"
    update_cycle: "On Jira comment changes, refresh requirements.md first, then re-enrich only changed requirements; write requirements-enriched-vN-diff.md"

  analyze:                              # Phase 6 (sub-steps: 6a context-expansion → 6b analyze-requirements → 6c flow-gate)
    skill: analyze-requirements
    strategy_registry: analyze-requirements/strategies.yaml
    readiness_gate: 6
    inputs:
      required:
        - "requirements-enriched.md (preferred — from Phase 5.5; falls back to requirements.md if Phase 5.5 was skipped for this ticket_type)"
        - "ticket-context.yaml"
        - "{project_docs}/code/domain_index.yaml"
      optional:
        - "{project_docs}/domain/_index.yaml (if status: fresh — entity registry)"
        - "{project_docs}/domain/_glossary.yaml (if exists — term definitions)"
        - "{project_docs}/db/db_index.yaml (if status: fresh — column types, FK constraints, enums)"
        - "{project_docs}/incidents/incidents.yaml (if status: fresh — consumed in step 6a to filter past incidents matching ticket scope)"
        - "{project_docs}/topology/topology.yaml (if status: fresh — consumed in step 6a to surface relevant cross-repo queues + health flags)"
        - "{project_docs}/flows/flow_index.yaml (if status: fresh — consumed in step 6c to detect business flows touched by this ticket and gate to DPS flow-trace before plan)"
    outputs:
      - "context-expansion.md (only if incidents.yaml OR topology.yaml exists AND not skipped per step 6a rules)"
      - "requirements-analysis.md (or behavior-spec.md for refactor strategy)"
      - "ticket-context.yaml (+ domain_entities_in_scope, complexity_flags, context_expansion.*, flow_gate.*)"
      - "dps-briefing.md (ONLY when step 6c gate fires AND user chooses 'route to DPS')"
    state_writes:
      phase: analyze                  # OR phase: awaiting_dps if 6c gate fires + user chose route
    blocks_on:
      - "open questions"
      - "dependent ticket not done (FM-DEPENDENT-TICKET-NOT-DONE)"
      - "physical impossibility"
      - "ambiguous shared term"
      - "flow-gate (6c) — user chose route-to-DPS → state: awaiting_dps; resume via do-ticket <ID> --from-dps=<session>"
      - "flow-gate (6c) — user chose manual block → state: blocked"
    stale_check: "phase_readiness[6] — requires code artifact fresh; flow gate degrades gracefully if flow_index.yaml missing"
    sub_steps:
      - "6a context-expansion (do-ticket internal): filter incidents/topology by ticket scope → write context-expansion.md. Skipped if both artifacts missing OR ticket_type ∈ {doc-only, hotfix} OR --from-dps mode. See do-ticket/SKILL.md Phase 6 step 6a for algorithm."
      - "6b analyze-requirements (skill invocation): runs as before, with context-expansion.md (if present) passed as pre-context hint alongside requirements.md."
      - "6c flow-gate (do-ticket internal): read {project_docs}/flows/flow_index.yaml; match flow keywords + entity references from requirements + analysis against flow_index; if any matched flow has health != ok OR known_gates non-empty OR complexity == high → G10 prompt route/skip/block. Route → write dps-briefing.md + set state phase: awaiting_dps. Skip → inject warning into ctx.plan_warnings[] for implement-plan to surface. Skipped entirely if --from-dps mode (DPS already provided context), or if ticket_type ∈ {doc-only, hotfix, spike}, or if state.flow_gate_decided already true. See do-ticket/SKILL.md Phase 6 step 6c for full algorithm."

  invariant-scope:                      # Phase 7
    skill: invariant-check (--pre)
    readiness_gate: 7
    inputs:
      required:
        - "requirements-analysis.md"
        - "ticket-context.yaml"
        - "{project_docs}/domain/_index.yaml"
      optional:
        - "{project_docs}/domain/<Entity>.yaml (one per entity in domain_entities_in_scope)"
        - "{project_docs}/domain/_maturity.yaml"
    outputs:
      - "invariants_in_scope.yaml"
      - "ticket-context.yaml (+ invariants_in_scope)"
    state_writes:
      phase: invariant-scope
    skip_when:
      - "ticket_type ∈ {doc-only, hotfix, refactor}"
      - "no entity in domain_entities_in_scope has a domain shard"
    stale_check: "phase_readiness[7] — requires domain artifact fresh"

  test-cases:                           # Phase 8
    skill: write-test-cases
    strategy_registry: write-test-cases/strategies.yaml
    inputs:
      required:
        - "requirements-analysis.md (or behavior-spec.md)"
        - "ticket-context.yaml"
      optional:
        - "requirements.md (fallback if analysis missing — bug-repro-only path)"
    outputs:
      - "test-cases.md"
    state_writes:
      phase: test-cases
    user_gate:
      "Show count + offer edit before proceeding"
    cross_check: "Every 'must not / cannot / reject when' constraint in analysis has ≥1 negative case"

  blast-radius:                         # Phase 8.7
    skill: do-ticket (internal)
    spec: do-ticket/blast-radius.md
    inputs:
      required:
        - "requirements-analysis.md (or behavior-spec.md)"
        - "ticket-context.yaml"
      optional:
        - "test-cases.md"
        - "{project_docs}/code/domain_index.yaml (starting point for the surface probe, NOT a boundary — the facts that kill designs live outside the index)"
    outputs:
      - "blast-radius.md"
      - "ticket-context.yaml (+ blast_radius.*, armed_gates[], no_marker)"
    state_writes:
      phase: blast-radius
    blocks_on: []                       # counting asks nothing of the user
    skip_when: "ticket_type in [doc-only, spike]"
    lite_when: "ticket_type == hotfix — touched-method counts only, no inventory"
    cross_check: >
      A count, never a claim. Every number carries the exact command that produced it. An unproducible
      number is written `not-countable — <why>`, which is itself a finding. NO DESIGN in this phase —
      picking a shape here is the defect the phase exists to stop.
    hard_rule: >
      "rather than adding infrastructure" is not a valid reason until the extension-point inventory is on
      disk AND empty. On PROJ-11332 that sentence chose the shape for the whole ticket and was factually
      wrong — the project already registered several save-time interceptors in its DbContext setup.

  plan:                                 # Phase 9
    skill: implement-plan
    readiness_gate: 9
    inputs:
      required:
        - "requirements.md"
        - "requirements-analysis.md (or behavior-spec.md)"
        - "test-cases.md"
        - "ticket-context.yaml"
        - "blast-radius.md (Phase 8.7 — every count in the plan must come from here; never re-derive or estimate)"
        - "{project_docs}/code/domain_index.yaml"
      optional:
        - "{project_docs}/patterns/_index.yaml (if exists — for pattern injection; auto-induction fallback)"
        - "{project_docs}/db/db_index.yaml (if status: fresh — table shapes for migration planning)"
        - "{project_docs}/build/test.yaml (test project paths + run commands)"
        - "{project_docs}/domain/_field_impact.yaml (if exists — §A question 5 base-value-impact lookup; degrades gracefully if absent)"
        - "context-expansion.md (if produced by step 6a — read for past-incident lessons + relevant queue topology before forming the plan)"
        - "update-implement-vN.md (update mode)"
        - "invariants_in_scope.yaml"
        - "ctx.flow_findings.* (when ticket resumed via --from-dps — flow_map per trigger path, gaps, decisions hydrated from DPS investigation-findings.md; primary input to plan when present)"
        - "ctx.plan_warnings[] (when Phase 6c flow-gate was bypassed — risky flows + known gates + keyword hits that the plan must explicitly address or note as accepted risk)"
    outputs:
      - "plan.md"
      - "ticket-context.yaml (+ pattern_matches, resolved.touched_files, resolved.test_project_paths, fingerprints.plan_sha)"
    state_writes:
      phase: plan
      plan_written_at: <iso>
    blocks_on:
      - "flagged risks requiring decision (G1)"
      - "domain_index missing entries (G1)"
    stale_check: "phase_readiness[9] — requires code + build artifacts fresh"
    lite_mode:
      when: "ticket_type ∈ {bugfix-small, hotfix}"
      output: "plan.md (≤1 page: file + method + 1-line description)"

  fe-impact-check:                      # Phase 9.5 — lazy FE compatibility gate (post-plan)
    readiness_gate: 9                   # piggybacks plan readiness; no separate scan-init dep
    inputs:
      required:
        - "plan.md"
        - "ticket-context.yaml"
      optional:
        - "{project_docs}/scan-api-docs/gateway_api_docs.yaml (for FE-consumed endpoint detection)"
    preconditions:
      skip_if: "ticket_type ∈ {fe-only, doc-only, hotfix, refactor, spike} OR plan changes no public API endpoint OR all affected endpoints are admin/internal (no FE caller)"
    algorithm:
      - "Extract affected_endpoints[] + proposed shape/cardinality/status-code changes from plan.md"
      - "Quick FE-consumer check: grep FE repo for each endpoint URL → if none consumed → skip (write fe-impact-check.md with verdict SKIPPED, no callers)"
      - "Otherwise spawn narrow Explore sub-agent with BE plan context (proposed shape, cardinality, status codes) + targeted FE grep scope (only affected endpoints)"
      - "Sub-agent checks: FE response handling logic, current cardinality usage at call site, i18n keys needed for new error/status values, store/component coupling that would break"
      - "Sub-agent returns: conflicts[] (file:line + nature) + verdict ∈ {SAFE, NEEDS_FE_CHANGE, NEEDS_BE_ADJUST}"
      - "Write fe-impact-check.md to ticket folder"
    outputs:
      - "tickets/{ID}/fe-impact-check.md"
    state_writes:
      phase: fe-impact-check
      fe_impact_decision: SAFE | NEEDS_FE_CHANGE | NEEDS_BE_ADJUST | SKIPPED
    blocks_on:
      - "NEEDS_BE_ADJUST → loop back to Phase 9 plan to reconcile (G1)"
      - "NEEDS_FE_CHANGE → G1 surface to user: file follow-up FE ticket OR ack as known gap and continue"
    stale_check: "no scan-init dependency — lazy scan at runtime, always fresh per ticket"

  unit-tests:                           # Phase 10
    skill: write-unit-tests
    readiness_gate: 10
    inputs:
      required:
        - "plan.md"
        - "test-cases.md"
        - "ticket-context.yaml"
        - "{project_docs}/build/test.yaml (test project paths, base class, run command)"
      optional: []
    outputs:
      - "Unit test files (RED) in test project"
      - "unit-tests-written.md (MUST include the machine-emitted RED line — see red_count_contract)"
    state_writes:
      phase: unit-tests
      red_count: "<int>  # tests observed FAILING at RED; reconciled against green_count at Phase 12"
    red_count_contract:
      # A test that does not RUN is also not RED. The RED phase is the cheapest place to catch a
      # filter/typo that matches zero tests — free, no extra tooling. Do not skip recording it.
      rule: "Run the new tests and paste the runner's own summary line verbatim into unit-tests-written.md."
      format: "RED: <N> failed, <P> passed, <S> skipped — <cmd> exit <code>"
      example: "RED: 5 failed, 0 passed, 0 skipped — dotnet test --filter FullyQualifiedName~OrderRecalcTests exit 1"
      write: "ticket-context.yaml → red_count: <N failed>"
    failure_modes: [FM-FALSE-GREEN-TEST, FM-EMPTY-MEASUREMENT]
    blocks_on:
      - "false-green tests (FM-FALSE-GREEN-TEST)"
      - "build failure (FM-DLL-LOCKED, others)"
      # Empty-measurement guard: an empty measurement is N/A, never a pass.
      - "RED line absent from unit-tests-written.md → cannot proceed (no evidence the tests ran)"
      - "N failed == 0 at RED → the filter matched nothing, or the tests assert nothing. STOP and
         show the runner output. Never interpret '0 failed' at RED as 'already satisfied'."
    stale_check: "phase_readiness[10] — requires build artifact fresh"
    fe_mode:
      when: "ticket_type=fe-only OR FE files in resolved.touched_files"
      additional_outputs:
        - "Jest/Karma .spec.ts files"
        - "Storybook .stories.ts for UI changes"

  legacy-contract:                      # Phase 9.8 — T0
    skill: do-ticket (internal)
    spec: do-ticket/legacy-contract.md
    skip_when: "ticket-context.armed_gates is empty (most tickets)"
    inputs:
      required:
        - "blast-radius.md (counts + extension-point inventory)"
        - "plan.md (shape + options considered)"
        - "ticket-context.yaml (armed_gates[], no_marker)"
      optional:
        - "{project_docs}/build/test.yaml (frozen-test command)"
    outputs:
      - "legacy-contract.md"
      - "ticket-context.yaml (+ contract_approved_at, frozen_baseline{cmd,passed,failed,failure_names,preconditions})"
    state_writes:
      phase: legacy-contract
    runs_a_command: >
      Runs the frozen tests BEFORE any code change. Records cmd + pass/fail counts + THE NAME OF EVERY
      FAILURE + preconditions (e.g. docker_running). A baseline with unnamed failures hides which
      capabilities were never exercised — PROJ-11350 printed "147 passed" while blind to every DB
      integration test because Docker was down.
    user_gate:
      "G-T0 — print the self-check block, ask once. The user approves a PREDICATE, not a plan."
    blocks_on:
      - "agent_owned_open != 0"
      - "any Q-CHOICE in plan.md with no options table"
      - "extension_point: EDIT while the inventory has an unexplained fits:yes row"
      - "frozen baseline missing, or its failures unnamed"

  contract-recheck:                     # Phase 12.7 — T1
    skill: do-ticket (internal)
    spec: do-ticket/legacy-contract.md
    skip_when: "ticket-context.armed_gates is empty"
    inputs:
      required:
        - "legacy-contract.md"
        - "ticket-context.frozen_baseline (VERBATIM — never re-derived)"
    outputs:
      - "ticket-context.yaml (+ contract_held: true|false, counts_moved[])"
    state_writes:
      phase: contract-recheck
    cross_check: >
      Re-run the SAME command against the SAME baseline. Pass count >= baseline AND the failure set
      unchanged AND preconditions identical AND blast-radius counts re-run to the same values.
      A changed precondition INVALIDATES the comparison — it is not a pass.
    on_fail: "loop back to implement (11). A moved count means the blast radius grew after approval → re-approve at T0."
    payoff: "All green → no second review. Print one line carrying the scope, then continue."

  implement:                            # Phase 11
    entry_gate: >
      G-T0 — if ticket-context.armed_gates is non-empty and contract_approved_at is unset, BLOCK and return
      to Phase 9.8. Auto-implement on a legacy surface without an approved contract is exactly what the
      contract exists to make safe.
    skill: implement
    strategy_registry: implement/strategies.yaml
    inputs:
      required:
        - "plan.md"
        - "unit-tests-written.md"
        - "ticket-context.yaml"
      optional:
        - "implement-log.md (resume mode)"
        - "update-implement-vN.md (update mode)"
    outputs:
      - "Source code changes"
      - "implement-log.md"
      - "implement-summary.md (must include the machine-emitted Regression line — see regression.evidence_contract)"
      - "ticket-context.yaml (+ strategies_picked.implement)"
    state_writes:
      phase: implement
    failure_modes: [FM-3X-SAME-ROOT, FM-LAYER-VIOLATION, FM-FALSE-GREEN-TEST]
    blocks_on:
      - "DB migration required (G3)"
      - "3+ same-root failures (G8)"
      - "domain layer importing infrastructure (FM-LAYER-VIOLATION)"

  regression:                           # Phase 12
    skill: do-ticket internal (verifies the RUN, not the claim)
    readiness_gate: 12
    inputs:
      required:
        - "implement-summary.md"
        - "{project_docs}/build/test.yaml (test run command)"   # was optional — a claim is not a run
        - "ticket-context.red_count (from Phase 10)"
      optional: []
    outputs:
      - "(verification only — no file; the numbers land in implement-summary.md + ticket-context)"
    state_writes:
      phase: regression
      green_count: "<int>  # tests observed PASSING here"
      tests_run: "<int>"
    # ---------------------------------------------------------------------------------------
    # Empty-measurement guard (the false green). This gate previously passed by finding the STRING
    # 'Regression check: PASS' inside a markdown file the agent had just written itself.
    # A run that matched zero tests (mistyped --filter, wrong test project, DB-integration
    # classes excluded by the local filter) exits 0, so the agent wrote PASS truthfully and
    # phases 13 → 16 all unlocked on a measurement that never happened.
    # Burned for real: PROJ-11098 — local green, CI red (reflection callers + Postgres
    # integration classes never ran locally).
    # A count cannot be faked the way a verdict can. Gate on the count.
    # ---------------------------------------------------------------------------------------
    evidence_contract:
      rule: "Re-run the suite HERE. Do not accept implement's word for it."
      required_line: "Regression: <P> passed, <F> failed, <S> skipped (baseline <B>) — <cmd> exit <code>"
      example: "Regression: 214 passed, 0 failed, 3 skipped (baseline 214) — dotnet test exit 0"
      baseline: "B = tests_run recorded on the last green run of this branch, or on clean base if
                 none. First run on a branch: record B and say so — do not silently set B = P."
      three_states: "PASS (F==0 and P>0) | FAIL (F>0) | N/A (P+F==0 — could not measure)"
    failure_modes: [FM-EMPTY-MEASUREMENT, FM-PLAN-CHANGESET-DRIFT, FM-TESTDB-STALE-OR-SHARED]
    blocks_on:
      - "implement-summary missing the machine-emitted Regression line (a prose 'PASS' is not evidence)"
      - "tests_run == 0 → N/A, NOT pass. The filter matched nothing. Show the raw runner output."
      - "P < baseline B → the suite SHRANK. Something stopped being collected; explain before proceeding."
      - "green_count < ticket-context.red_count → fewer tests passing here than were failing at RED;
         the new tests are not all being collected."
      - "test.yaml declares an integration/DB suite that the local filter excludes → run it, or record
         it explicitly as DEFERRED-TO-CI in implement-summary. Never let an excluded suite read as green."
      - "FM-PLAN-CHANGESET-DRIFT (files in diff not in plan)"
    stale_check: "phase_readiness[12] — requires build artifact fresh"

  code-quality-review:                  # Phase 13.5 — diff-scoped quality gate (post-code). See code-quality-review.md §B.
    skill: do-ticket internal
    inputs:
      required:
        - "git diff of this ticket's changes (staged+unstaged, or <base>...HEAD on update)"
        - "implement-summary.md"
        - "ticket-context.yaml"
      optional:
        - "plan.md (+ ctx.structural_quality_decisions[] — to close the mirror-vs-improve loop from Phase 9 §A)"
        - "{project_docs}/domain/_glossary.yaml (naming-vs-ubiquitous-language check)"
        - "{project_docs}/conventions.md OR {project_docs}/conventions/*.yaml (conformance check)"
    outputs:
      - "code-quality-review.md"
      - "ticket-context.yaml (+ quality_findings[], deferred_quality_items[])"
      - "{project_docs}/domain/_field_impact.yaml (LAZY/OPTIONAL — appended ONLY when the diff touches a base value: dimension 11 supersession-hygiene; absent otherwise. A domain registry, underscore-prefixed like _relationships.yaml. Read at Phase 9 §A; deduped + reindexed at Phase 22.5. See code-quality-review.md §B 'Base-value supersession hygiene')"
    state_writes:
      phase: code-quality-review          # OR loops to implement (11) when must-fix open
    failure_modes: [FM-QUALITY-MUST-FIX, FM-EMPTY-MEASUREMENT, FM-REVIEW-LOOP-EXHAUSTED]
    # Empty-measurement guard: 'all clean' from a review that examined NOTHING is indistinguishable
    # from 'all clean' from a review that examined 40 files. An empty diff is easy to produce by
    # accident — wrong <base> after a rebase, renamed base branch, or git running in the wrong
    # repo dir on a multi-repo ticket. Always print the scope measured.
    scope_evidence:
      rule: "Every verdict line states what was actually reviewed. No bare 'clean'."
      format: "<verdict> — <F> files, <A> added lines reviewed (base: <ref>)"
      example: "✅ Quality review clean — 14 files, 380 added lines reviewed (base: origin/master)"
    blocks_on:
      - "any quality_findings[status=open, severity=must-fix] → loop to implement (11), re-run 12/13/13.5"
      - "diff scope resolves to 0 files or 0 added lines → N/A, NOT clean. Re-resolve <base> and
         confirm the repo dir before re-running; on a multi-repo ticket check EVERY repo."
      - "review loop hit its max rounds with findings still open → FM-REVIEW-LOOP-EXHAUSTED (stop, report to the user)"
    user_gate:
      "If only nice-to-have findings: surface once, per-item fix-now/defer. If clean: 1-line summary
       INCLUDING the scope figures (scope_evidence.format), no prompt."
    scope_discipline: "DIFF only — never the whole repo. Pre-existing debt in touched-but-unchanged code = out-of-scope finding (log / optional spawn_task), never fixed in this ticket."
    skip_when:
      - "ticket_type ∈ {doc-only, spike, hotfix}"
    lite_mode:
      when: "ticket_type ∈ {bugfix-small, refactor}"
      detail: "dimensions 1,2,4,6,8 only (structural + test core); ≤1-screen output"

  env-gate:                             # Phase 14
    skill: do-ticket internal
    readiness_gate: 14
    inputs:
      required:
        - "implement-summary.md"
        - "explicit user confirmation that services are running"
        - "{project_docs}/build/run.yaml (service list, ports, dependencies)"
      optional: []
    outputs:
      - "(no file)"
    state_writes:
      phase: env-gate
    # A human attestation ("yes, it's running") is honest and still wrong when the process holds a
    # stale DLL — phase 15 then tests the OLD code and passes. Turn the attestation into a probe
    # wherever run.yaml gives you one; keep the human answer as the fallback, not the only signal.
    liveness_probe:
      rule: "For each service with a health/ping endpoint in build/run.yaml, curl it and show the
             result next to the user's confirmation. Probe failure ≠ block — it is a warning that
             the user's 'yes' and the machine disagree; ask which is right."
      staleness_hint: "If the change touched a running service, compare the service's build/start
                       timestamp against the last local build. Older → it is serving pre-change code."
    user_gate:
      "List required services from build/run.yaml + show probe results + wait for confirmation"
    stale_check: "phase_readiness[14] — requires build artifact fresh"

  api-test:                             # Phase 15
    skill: "your live-API test skill (whatever holds this project's requests, tokens and ports)"
    inputs:
      required:
        - "ticket-context.yaml"
        - "implement-summary.md"
        - "running services (env-gate confirmed)"
      optional:
        - "{project_docs}/api/gateway_api_docs.yaml (if status: fresh — produced by scan-api-docs; stale check: compare fingerprint vs gateway controller source SHA)"
    outputs:
      - "Updated entity YAMLs in public-project-docs/<project>/api/entities/"
      - "Postman collection synced"
      - "{ticket_dir}/test-evidence/{flow}/01_request.txt + 02_response.txt (+ 03_db_verify.txt)"
      - "ticket-context.yaml (+ strategies_picked.api-test, + api_flows_verified[])"
    state_writes:
      phase: api-test
    # This is a MANDATORY pre-commit gate for crud-feature / bugfix-investigated, yet it used to
    # conclude on the agent's word with no artefact. A flow you cannot replay from disk was not
    # verified.
    evidence_contract:
      rule: "A flow is 'verified' only if its request/response is on disk. No artefact ⇒ not verified."
      files:
        - "01_request.txt  — method, URL, headers (token redacted), body"
        - "02_response.txt — HTTP status + full body"
        - "03_db_verify.txt — the verification query AND its row count, when the flow persists anything"
      expected_vs_observed: "Head 02_response.txt with two lines — 'Expected: …' / 'Observed: …' — so
                             the verdict is checkable later without re-running anything."
      empty_result_rule: "A verification query returning 0 rows is N/A, never PASS. Zero rows cannot
                          distinguish 'the write failed' from 'the query is wrong'. State the expected
                          row count BEFORE running, and reconcile."
    failure_modes: [FM-SILENT-API-BUG, FM-WRONG-ENV-PROFILE, FM-EMPTY-MEASUREMENT, FM-FALSE-GREEN-TEST]
    blocks_on:
      - "any flow reported verified with no evidence files on disk"
      - "03_db_verify.txt shows 0 rows on a flow that should have persisted → N/A, return to implement
         only after confirming the query itself is right (FM-SILENT-API-BUG covers the write; this
         covers the measurement)"
      - "a multi-step flow where an earlier step returned >=400 → MEASUREMENT INVALID (FM-FALSE-GREEN-TEST pivot assert-every-step)"
    skip_when:
      - "strategy = skip"
      - "ticket_type ∈ {doc-only}"

  commit:                               # Phase 16
    skill: do-ticket internal
    inputs:
      required:
        - "implement-summary.md"
        - "All tests green (unit + api-test)"
        - "explicit user confirmation"
      optional: []
    outputs:
      - "git commit (only files from implement-summary.md)"
    state_writes:
      phase: commit
    failure_modes: [FM-SHARED-VERSION-COLLISION]   # re-check shared <Version> here too: a clean rebase can silently duplicate master's version
    user_gate:
      "Show proposed message + file list, wait for y/n"
    invariants:
      - "Never use git add -A — only stage explicit files"
      - "Commit format: <TICKET_ID>: short description"
      - "If shared-lib repo in changeset: commit it FIRST with <Version> = master+1 (FM-SHARED-VERSION-COLLISION)"

  pre-push:                             # Phase 17
    skill: push-code                     # standard pre-push gate — the ONLY sanctioned push path (no plain `git push` fallback)
    readiness_gate: 17
    inputs:
      required:
        - "Latest commit + full branch diff (git diff <base>...HEAD)"
        - "projects.<active>.sonar block (host, org, token_env, gates, project_key_resolution)"
        - "{project_docs}/conventions/security.yaml (secret regex patterns, auth-endpoint patterns)"
      optional:
        - "code-quality-review.md (§B methodology reused for the final review step)"
    outputs:
      - "local gate result (Sonar rule issues on new code + new-code coverage%) in chat; duplication-on-new-code explicitly reported as DEFERRED TO CI"
      - "pushed branch (on all-green + confirm)"
    state_writes:
      phase: pre-push
    # push-code owns the full gate; do-ticket keeps the migration warn. Its own gates
    # (G-CONFIG/G-TOOLCHAIN) hard-stop if sonar config or toolchain is missing — never falls through to an ungated push.
    failure_modes: [FM-SECRETS-IN-DIFF, FM-UNPROTECTED-ENDPOINT, FM-MIGRATION-DOWN-EMPTY, FM-QUALITY-MUSTFIX, FM-ANALYSIS-FAILED, FM-SONAR-NEWISSUE, FM-COVERAGE-LOW]
    hard_stops_on: [FM-SECRETS-IN-DIFF, FM-UNPROTECTED-ENDPOINT]
    gate_blocks_on: [FM-QUALITY-MUSTFIX, FM-ANALYSIS-FAILED, FM-SONAR-NEWISSUE, FM-COVERAGE-LOW]  # block push, loop to implement (11→12→13→13.5), re-run 17
    delegates_to: push-code              # see push-code/SKILL.md + sonar-local-gate.md
    stale_check: "phase_readiness[17] — requires conventions artifact fresh"

  ci-check:                             # Phase 18
    skill: do-ticket internal
    readiness_gate: 18
    inputs:
      required:
        - "{project_docs}/conventions/ci.yaml (CI provider, workflow paths, version bump strategy)"
      optional: []
    outputs:
      - "(verification only)"
    state_writes:
      phase: ci-check
    failure_modes: [FM-CI-FAILURE]
    stale_check: "phase_readiness[18] — requires conventions artifact fresh"

  invariant-encoded:                    # Phase 19
    skill: invariant-check (--post)
    readiness_gate: 19
    inputs:
      required:
        - "Latest commit (git diff)"
        - "invariants_in_scope.yaml"
      optional:
        - "{project_docs}/domain/<Entity>.yaml (one per entity in scope — for maturity update)"
        - "{project_docs}/domain/_maturity.yaml"
    outputs:
      - "invariants_encoded.yaml"
      - "{project_docs}/domain/_maturity.yaml (updated — bump tier if newly enforced in code)"
    state_writes:
      phase: invariant-encoded
    skip_when:
      - "invariant-scope was skipped"
    stale_check: "phase_readiness[19] — requires domain artifact fresh"

  qa-checklist:                         # Phase 20
    skill: qa-checklist
    inputs:
      required:
        - "requirements.md"
        - "implement-summary.md"
        - "ticket-context.yaml"
      optional: []
    outputs:
      - "qa-checklist.md"
    state_writes:
      phase: qa-checklist
    skip_when:
      - "ticket_type ∈ {refactor, hotfix, doc-only, migration-only, spike}"

  pr-ready:                             # Phase 21
    skill: pr-description
    readiness_gate: 21
    inputs:
      required:
        - "plan.md"
        - "implement-summary.md"
        - "ticket-context.yaml"
        - "{project_docs}/conventions/git.yaml (branch naming, commit format)"
        - "{project_docs}/conventions/ci.yaml (version bump strategy — used to set PR title prefix)"
      optional:
        - "invariants_encoded.yaml"
    outputs:
      - "pr-description.md"
    state_writes:
      phase: pr-ready
    user_gate:
      "Show PR description + wait for y/n before gh pr create"
    stale_check: "phase_readiness[21] — requires conventions artifact fresh"

  pr-review:                            # Phase 22
    skill: handle-pr-review
    inputs:
      required:
        - "PR comments (pasted or fetched)"
        - "ticket-context.yaml"
      optional: []
    outputs:
      - "update-implement.md"
      - "pr-review-log.md"
      - "split-plan.md (if split requested)"
    state_writes:
      phase: pr-review
    triggers_re_run: "Phases 5-13.5 re-run in update mode (incl. code-quality-review on the new diff)"

  promote-knowledge:                    # Phase 22.5 — see promote-knowledge.md for full spec
    skill: promote-observations (extended)
    inputs:
      required:
        - "implement-summary.md"
        - "plan.md"
        - "requirements-analysis.md"
        - "git diff of merge commit"
        - "~/.claude/skills/assistant/observations.md"
        - "{project_docs}/_index.yaml"
        - "{project_docs}/domain/_index.yaml"
        - "{project_docs}/INDEX.md"
      optional:
        - "invariants_encoded.yaml"
    outputs:
      - "promoted.md"
      - "Updates to {project_docs}/domain/, concepts/, patterns/, runbooks/, _quickref.yaml, INDEX.md"
      - "{project_docs}/domain/_field_impact.yaml (deduped + reindexed when Phase 13.5 dimension-11 wrote load-bearing-field entries this ticket)"
      - "_index.yaml fingerprint refresh"
      - "ticket-context.yaml (+ promoted_count, new_files_created[])"
    state_writes:
      phase: promote-knowledge
    user_gate:
      "Show detection table → wait for approve / skip / reclassify / merge / rename"
    skip_when:
      - "ticket_type ∈ {doc-only, spike, hotfix}"
      - "user opted out via --no-promote flag"
    failure_modes: [FM-PROMOTE-DUP-CONFLICT, FM-PROMOTE-FINGERPRINT-DRIFT, FM-PROMOTE-INDEX-WRITE-FAIL, FM-PROMOTE-NO-ENTITY, FM-PROMOTE-OVER-EAGER]
    hard_stops_on: [FM-PROMOTE-INDEX-WRITE-FAIL]

  done:                                 # Phase 23
    skill: do-ticket internal
    inputs:
      required: []
      optional: []
    outputs:
      - "Final summary in chat"
      - "run-telemetry.yaml (closed out)"
    state_writes:
      phase: done

# Phase order is determined by ticket_type (see do-ticket/ticket-types.md).
# This file defines WHAT each phase contracts; ticket-types.md defines WHICH
# phases run for a given ticket type.

# How do-ticket uses this file:
#
# 1. Before invoking phase X:
#    - Load contracts.<X>
#    - Verify every input in contracts.<X>.inputs.required exists and matches fingerprint
#    - If missing → FM-PREREQ-MISSING → suggest earliest phase that produces missing input
#
# 2. After phase X returns:
#    - Verify every file in contracts.<X>.outputs was produced
#    - Verify state_writes happened
#    - Compute fingerprints for any new file → write to ticket-context.fingerprints
#
# 3. On phase jump request (do-ticket TICKET phase=X):
#    - Walk contracts backward from X computing missing inputs
#    - Earliest phase with missing input = entry point
#    - Offer: "Run from <entry> instead of <X>?"
#
# 4. On staleness:
#    - For any phase with completed output, check inputs' current SHAs vs fingerprints
#    - If drift → FM-FINGERPRINT-STALE → offer regen of dependent outputs
