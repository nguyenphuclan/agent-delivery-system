# Sync tracker — agent-delivery-system public mirror
# Records the last commit from the private skills repo that was synced into this repo.
# Usage:
#   1. git log <last_synced_commit>..HEAD -- skills/<skill>/SKILL.md  (in private repo)
#   2. Review + sanitize the diff
#   3. Apply changes to this repo
#   4. Update last_synced_commit + last_synced_at below
#
# HONESTY RULE: only advance last_synced_commit when EVERY hunk of a skill's delta was either
# synced or written down under that skill's `skipped` / `deferred` list (2026-10-27: a selective
# sync with each skip recorded is not a silent drop). Anything not decided keeps the old commit
# + a `partial_sync` note. A lying tracker is worse than a
# stale one — it silently drops the unsynced remainder forever.
#
# VERIFY, DON'T TRUST: the two tracker copies (private + public) have drifted apart before, in
# both directions. Before diffing, grep the public file for the feature you're about to add —
# an earlier sync may have landed it without recording the commit.
#
# SANITIZE: this mirror uses a fictional org — `acme` for company/repo names, `PROJ-<n>` for
# ticket ids, `Acme.*` for namespaces, `sonarqube.acme.com` for hosts. The literal private->public
# token map lives ONLY in the private copy of this file: writing the real names here would leak
# exactly what the map exists to remove. Also scrub real customer/queue/class names,
# machine-specific status tables, "this machine" phrasing, and personal-preference asides.

private_repo: ~/.claude/skills

skills:
  scan-init:
    source_files:
      - skills/scan-init/SKILL.md
      - skills/scan-init/surface-layers.md
    last_synced_commit: b76f7fd
    last_synced_at: 2026-10-27
    sync_2026_10_27:
      synced: >
        The rule "never conclude no consumer / no publisher from a SOURCE-ONLY scan" (base-class
        consumers and DB-row schedulers are invisible to it). Also fixed an older leak: the flows
        example now uses neutral order names and rule ids.
    sync_note: >
      2026-08-29 FULL sync of SKILL.md. Landed: the doc-durability global content rule, and the
      schema + fingerprint fixes — V-4 now requires `entity, identity, lifecycle` instead of
      `source, fields` (the old pair demanded exactly what doc-durability-protocol bans, so no
      store could ever pass), the entity template, the git-blob-sha Fingerprint definition
      replacing the mtime one, `fingerprint_pending`, the placeholder refusal on both baseline
      commands, the F-2/F-3 ordering trap, and "never computed" blocking `pass`.
      surface-layers.md unchanged since the last sync.

  _shared:
