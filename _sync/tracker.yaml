# ---------------------------------------------------------------------------
# NEVER MIRRORED — decided, do not re-litigate each sync.
# ---------------------------------------------------------------------------
never_mirrored:
  game_and_personal_project_skills:
    skills: [phat-dat-dev, ong-trum-dev, loom-dev, crossroads-dev, earths-reach-dev,
             sprout-dev, sprout-scan, card-art, "zuno-*"]
    reason: >
      Hobby/personal-project skills, not reusable delivery methodology. Decided 2026-07-26.
      Don't even offer a sanitize pass — commit to the private repo and stop.

  spec-push:
    reason: >
      Self-declared company-only: the entire skill publishes into one company's spec meta-repo and
      drives that org's own spec-review skill. 43 company tokens with no generic counterpart —
      sanitizing yields a fictional skill nobody outside can run. Reassess only if the meta-repo
      publishing pattern is ever generalized. Decided 2026-07-26.

  knowledge-audit_and_learn:
    skills: [knowledge-audit, learn]
    reason: >
      Both operate on the owner's personal knowledge stores (a note vault, agent memory, the local
      project-docs tree, the skills folder, editor settings) — the store list, the priority ladder,
      and the write-time sync hook are personal infrastructure, not delivery methodology. Sanitizing
      yields a skill that audits stores the reader does not have. Decided 2026-07-30.
      CONSEQUENCE, recorded so it is not rediscovered: the rule-hygiene work of 2026-07-30 is
      therefore absent here — the `rule-contradiction` / `stale-reason` audit ops and the
      checkable-vs-principle rule classification live in knowledge-audit, and the capture dimension
      that feeds them lives in learn. The one otherwise-syncable piece (promote-observations'
      `rule-conflict` routing) was ALSO skipped, because its only destination is
      `/knowledge-audit --rules` — publishing it alone would give a reader a task type that routes
      nowhere. Revisit together if knowledge-audit is ever generalized to a config-declared store list.

  web-test-automation:
    reason: >
      Generic algorithm, but the output path and workflow are wired to a personal review folder,
      and it duplicates well-covered public ground (Playwright scaffolding). Low mirror value.
      Decided 2026-07-26 — revisit if the scaffold is ever made config-driven.

  ticket-pick:
    reason: >
      Owner decision 2026-10-27. Output is Vietnamese by design and it scores tickets against one
      person's own familiarity profile. Same class as the owner-store skills above.

  personal_stores_and_session_modes:
    skills: [stock-research, doc-manager, assistant, root]
    reason: >
      They work on the owner's personal stores or the owner's own app/session setup, or route to
      skills this mirror does not carry. Decided 2026-09-03 to 2026-10-16.

  owner_measurement_tools:
    files: [_shared/tools/decision_log.py, _shared/tools/agent_learning_report.py,
            _shared/tools/lesson_eval/, _shared/tools/tool_scorecard.py]
    reason: >
      Decided 2026-10-27. They measure the owner's own agent memory, autonomy and scripts from
      the owner's transcripts (one has a phrase rubric in the owner's language; one audits the
      private BET/OWNER header convention). Personal measurement, not delivery method.

  autorun_and_learn-crud-gui:
    skills: [autorun, learn-crud-gui]
    reason: >
      Decided 2026-10-27. autorun runs do-ticket headless on the owner's own machine (scheduled
      task, owner-active detection). learn-crud-gui depends on learn-crud and a company rule for
      GUI proof per AC. Neither is reusable without the owner's setup.
