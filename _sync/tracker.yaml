      - skills/do-ticket/failure-modes.yaml
      - skills/do-ticket/ticket-types.md
      - skills/do-ticket/ticket-context-schema.md
      - skills/do-ticket/do-ticket-patterns.md
      - skills/do-ticket/run-telemetry-schema.md
      - skills/do-ticket/promote-knowledge.md
      - skills/do-ticket/do-ticket-update.md
      - skills/do-ticket/quality-review.md
      - skills/do-ticket/code-quality-review.md
      - skills/do-ticket/phases/*.md
      - skills/do-ticket/blast-radius.md
      - skills/do-ticket/legacy-contract.md
      - skills/do-ticket/triage-scoring.md
    last_synced_commit: b76f7fd
    last_synced_at: 2026-10-27
    sync_2026_10_27:
      synced: >
        Router split: SKILL.md is now a router +
        phases/{start,analyze,design,build,verify,ship,adhoc}.md. Measurement hardening (Ph10 red_count,
        Ph12 re-run PASS/FAIL/N-A, Ph13/13.5 scope lines, Ph15 evidence on disk, Ph16 telemetry
        pre-check as a manual check). Legacy gates 8.7 blast-radius / 9.8 legacy-contract / 12.7 recheck
        + G-T0 + decision modes M1/M2/M3. Sessions S1-S3 + RESUME.md. Squash-merged branch -> <ID>a.
        Ph18 shared-lib vs consumer CI and conditions-vs-lines. code-quality-review: cold reviewer, 29
