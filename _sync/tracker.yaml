        Skipped: the owner section (needs a private owner profile).
      tools_wired: >
        Round 2: the manual checks now call `_shared/tools/` (check_artifacts, ticket_fingerprints,
        optional ticket_cost); the manual text stays as the fallback.
    partial_sync:
      at: 2026-07-26
      synced: >
        ONLY the push-code wiring slice — phase table rows 17/18, Phase 17 prose (delegates to
        push-code), Phase 18 (still the sole duplication + server-quality-gate check), the
        phase-contracts pre-push contract, and the Phase 14 HARD PRE-CHECK that 13.5 must have run.
      not_synced: >
        The rest of the 2b2b762..HEAD backlog. Known-missing publicly: code-quality-review.md
        §B comment-standard table + the write-time SonarC# gotchas (S125 prose-as-code, S3358
        nested ternary), and the phase-24 qc-evidence row. Deliberately left: applying the gotchas
        without their parent comment-standard section would leave the public doc incoherent.
        Do a dedicated code-quality-review.md pass, then advance last_synced_commit.
      drift_observed: >
        Public already contained _field_impact.yaml + the dimension-11 base-value section, which
        this tracker's commit predates — so some earlier sync landed content without recording it.
        Treat both last_synced_commit values as lower bounds, not truth.
    partial_sync_2:
      at: 2026-07-30
      synced: >
        The measurement-integrity slice — FM-EMPTY-MEASUREMENT (new failure mode, fully generic) and
        code-quality-review.md's BLOCKED verdict + Dimensions-run / Not-examined header.
      not_synced: >
        The 2b2b762..HEAD backlog is STILL open (see partial_sync above). Also not synced: the
        phase-hardening work in SKILL.md + phase-contracts.yaml.
        CORRECTION (this note previously called that work "an unrelated in-flight change" — it is not,
        and the mislabel would have sent the next sync past the strongest part of the backlog): it is
        the SAME measurement-integrity feature applied to the pipeline phases — Phase 10
        red_count_contract (0 failed at RED is a STOP, not a pass), Phase 12 re-runs the suite instead
        of trusting a "Regression check: PASS" string in a markdown file the agent wrote itself (three
        states PASS/FAIL/N-A, baseline + red_count reconciliation), Phase 13 and 13.5 scope_evidence,
        Phase 15 api-test evidence-on-disk + the 0-rows-is-N/A rule. Motivated by a real
        local-green/CI-red incident where reflection callers and DB integration classes never ran
        locally. It IS syncable and generic; it needs the ticket id and the repo-specific
        build/test.yaml phrasing generalised. Do it as a dedicated pass with the comment-standard
        table, then advance last_synced_commit.
        Commit stays at 2b2b762.

  push-code:
