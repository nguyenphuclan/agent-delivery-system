        SONAR-LOCAL-CI-DIVERGE, SHARED-VERSION-COLLISION, REVIEW-LOOP-EXHAUSTED). Spike types redirect
        to the spike skill. promote-knowledge marked implemented. This CLOSES both partial_sync backlogs
        above.
      skipped: >
        unattended/background mode; AI-first mode table + owner-level gate rows;
        interaction-classification; owner familiarity; 15.2 GUI proof per AC; 15.5 spec publishing +
